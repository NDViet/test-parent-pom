name: Publish Parent POM to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-maven-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_MAVEN_USERNAME: ${{ secrets.GH_PACKAGES_USERNAME != '' && secrets.GH_PACKAGES_USERNAME || github.actor }}
      GH_MAVEN_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Resolve deploy revision
        shell: bash
        run: |
          base_revision="$(sed -n 's|.*<revision>\([^<]*\)</revision>.*|\1|p' pom.xml | head -n 1)"
          if [ -z "${base_revision}" ]; then
            echo "Could not resolve <revision> from pom.xml"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag pushes are release publishes: never keep SNAPSHOT suffix.
            deploy_revision="${base_revision%-SNAPSHOT}"
          else
            # Master pushes are snapshot publishes.
            if [[ "${base_revision}" == *-SNAPSHOT ]]; then
              deploy_revision="${base_revision}"
            else
              deploy_revision="${base_revision}-SNAPSHOT"
            fi
          fi

          echo "DEPLOY_REVISION=${deploy_revision}" >> "${GITHUB_ENV}"
          echo "Deploy revision: ${deploy_revision}"

      - name: Build parent POM with Gradle
        shell: bash
        env:
          GH_MAVEN_USERNAME: ${{ env.GH_MAVEN_USERNAME }}
          GH_MAVEN_TOKEN: ${{ env.GH_MAVEN_TOKEN }}
        run: |
          gradle --no-daemon -Prevision="${DEPLOY_REVISION}" build

      - name: Publish to GitHub Maven Registry
        env:
          GH_MAVEN_USERNAME: ${{ env.GH_MAVEN_USERNAME }}
          GH_MAVEN_TOKEN: ${{ env.GH_MAVEN_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle --no-daemon -Prevision="${{ env.DEPLOY_REVISION }}" deploy
